<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4월 스레드 챌린지 트래커</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-warm: #fdfbf8;
  --border: rgba(194,154,108,0.15);
  --border-hover: rgba(194,154,108,0.3);
  --primary: #c29a6c;
  --primary-deep: #a67c52;
  --primary-light: #e8d5bf;
  --primary-glow: rgba(194,154,108,0.12);
  --accent: #d4a855;
  --accent-deep: #b8902e;
  --gold: #c9a84c;
  --gold-light: #f5edda;
  --text: #2c2418;
  --text-secondary: #8c7e6f;
  --text-muted: #b5a899;
  --success: #5a9e6f;
  --success-bg: #eef6f0;
  --warning: #d4a855;
  --warning-bg: #fdf6e7;
  --danger: #c75d5d;
  --shadow-sm: 0 1px 2px rgba(44,36,24,0.04), 0 2px 8px rgba(44,36,24,0.03);
  --shadow-md: 0 2px 4px rgba(44,36,24,0.04), 0 8px 24px rgba(44,36,24,0.06);
  --shadow-lg: 0 4px 8px rgba(44,36,24,0.04), 0 16px 40px rgba(44,36,24,0.08);
  --radius: 14px;
  --radius-sm: 10px;
}
body {
  font-family: 'Noto Sans KR', 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, #3d2e1f 0%, #5a4232 40%, #6b5040 100%);
  color: #fff; padding: 32px 28px 28px; position: relative; overflow: hidden;
}
.header::before {
  content:''; position:absolute; top:-80px; right:-40px; width:280px; height:280px;
  background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 70%); border-radius:50%;
}
.header::after {
  content:''; position:absolute; bottom:-100px; left:5%; width:350px; height:350px;
  background: radial-gradient(circle, rgba(194,154,108,0.1) 0%, transparent 65%); border-radius:50%;
}
.header-inner { position:relative; z-index:1; max-width:920px; margin:0 auto; }
.header-top { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
.header-icon {
  width:44px; height:44px; border-radius:12px;
  background: linear-gradient(135deg, var(--gold), var(--accent-deep));
  display:flex; align-items:center; justify-content:center; font-size:22px;
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}
.header h1 { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
.header p { font-size:13px; color:rgba(255,255,255,0.6); font-weight:400; margin-left:58px; margin-top:-2px; }

/* ===== TABS ===== */
.tabs {
  background: rgba(255,255,255,0.97); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  display:flex; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;
  box-shadow: 0 1px 8px rgba(44,36,24,0.04);
}
.tab-btn {
  padding:15px 24px; font-size:13px; font-weight:500; border:none; background:none;
  cursor:pointer; color:var(--text-muted); border-bottom:2.5px solid transparent;
  transition:all 0.3s ease; font-family:inherit; position:relative;
}
.tab-btn:hover { color:var(--primary-deep); }
.tab-btn.active { color:var(--primary-deep); border-bottom-color:var(--primary); font-weight:700; }
.tab-right { margin-left:auto; display:flex; align-items:center; padding-right:16px; gap:8px; }
.btn-csv {
  background:var(--text); color:#fff; border:none;
  padding:8px 18px; border-radius:var(--radius-sm); font-size:12px; cursor:pointer;
  font-family:inherit; font-weight:600; transition:all 0.2s; letter-spacing:-0.2px;
}
.btn-csv:hover { background:#1a1510; transform:translateY(-1px); box-shadow:var(--shadow-md); }

/* ===== LAYOUT ===== */
.container { max-width:920px; margin:0 auto; padding:24px 16px 48px; }
.panel { display:none; }
.panel.active { display:block; animation:fadeUp 0.4s cubic-bezier(0.22,1,0.36,1); }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* ===== CARDS ===== */
.card {
  background:var(--surface); border-radius:var(--radius); padding:24px; margin-bottom:16px;
  box-shadow:var(--shadow-sm); border:1px solid var(--border);
  transition: box-shadow 0.3s ease;
}
.card:hover { box-shadow:var(--shadow-md); }
.card-title {
  font-size:15px; font-weight:700; margin-bottom:20px; color:var(--text);
  display:flex; align-items:center; gap:10px; letter-spacing:-0.3px;
}
.card-title .icon {
  width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:14px; background:var(--gold-light); flex-shrink:0;
}

/* ===== SUMMARY ===== */
.summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
.summary-card {
  border-radius:var(--radius); padding:20px; position:relative; overflow:hidden;
  border:1px solid var(--border); background:var(--surface-warm);
}
.summary-card .label { font-size:11px; font-weight:500; color:var(--text-secondary); letter-spacing:0.3px; text-transform:uppercase; }
.summary-card .value { font-size:30px; font-weight:900; margin-top:8px; letter-spacing:-1.5px; color:var(--text); font-family:'Inter','Noto Sans KR',sans-serif; }
.summary-card .bar { position:absolute; bottom:0; left:0; right:0; height:3px; }
.sc-1 .bar { background:linear-gradient(90deg, var(--primary), var(--gold)); }
.sc-2 .bar { background:linear-gradient(90deg, var(--success), #7bc08a); }
.sc-3 .bar { background:linear-gradient(90deg, var(--accent), var(--gold)); }
.sc-4 .bar { background:linear-gradient(90deg, var(--primary-deep), var(--primary)); }

/* ===== TODAY STATUS ===== */
.today-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.today-item {
  display:flex; align-items:center; padding:12px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); transition:all 0.2s;
}
.today-item:hover { border-color:var(--border-hover); background:var(--surface-warm); }
.today-item.complete { border-color:rgba(90,158,111,0.25); background:var(--success-bg); }
.dot { width:8px; height:8px; border-radius:50%; margin-right:12px; flex-shrink:0; }
.dot-green { background:var(--success); }
.dot-yellow { background:var(--warning); }
.dot-red { background:var(--danger); }
.today-name { flex:1; font-weight:600; font-size:13px; color:var(--text); }
.today-info { font-size:11px; color:var(--text-muted); margin-right:10px; font-weight:500; }
.badge { font-size:10px; padding:3px 10px; border-radius:20px; font-weight:600; letter-spacing:-0.2px; }
.badge-on { background:var(--text); color:#fff; }
.badge-off { background:rgba(0,0,0,0.05); color:var(--text-muted); }

/* ===== SIREN ALERT ===== */
.siren-item { border-color:var(--danger) !important; background:linear-gradient(135deg,#fff 60%,#fde8e8) !important; }
.siren { display:inline-block; font-size:18px; margin-right:6px; animation:sirenPulse 0.8s ease-in-out infinite alternate; }
@keyframes sirenPulse { from{transform:scale(1);opacity:0.7} to{transform:scale(1.25);opacity:1} }
.siren-tag {
  font-size:10px; padding:3px 10px; border-radius:20px; font-weight:700;
  background:var(--danger); color:#fff; letter-spacing:-0.2px;
  animation:sirenBlink 1.2s ease-in-out infinite;
}
@keyframes sirenBlink { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ===== RANKINGS ===== */
.rank-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.rank-medal {
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; flex-shrink:0; font-family:'Inter',sans-serif;
}
.rm-1 { background:linear-gradient(135deg,#f5e6b8,#d4a855); color:#7a5c1f; box-shadow:0 2px 8px rgba(212,168,85,0.3); }
.rm-2 { background:linear-gradient(135deg,#e8e8e8,#c0c0c0); color:#666; }
.rm-3 { background:linear-gradient(135deg,#f0d9c0,#c29a6c); color:#6b4d2e; }
.rm-n { background:var(--surface-warm); border:1px solid var(--border); color:var(--text-muted); }
.rank-name { width:76px; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.rank-bar-bg { flex:1; background:rgba(194,154,108,0.08); border-radius:8px; height:28px; position:relative; overflow:hidden; }
.rank-bar {
  height:100%; border-radius:8px;
  background:linear-gradient(90deg, var(--primary), var(--gold), var(--accent));
  transition:width 0.7s cubic-bezier(0.22,1,0.36,1);
}
.rank-pct {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.2);
  font-family:'Inter',sans-serif;
}
.rank-days { width:52px; text-align:right; font-size:12px; color:var(--text-muted); font-weight:500; font-family:'Inter',sans-serif; }

/* ===== CALENDAR ===== */
.cal-header { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
.cal-header div { text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding:6px; text-transform:uppercase; letter-spacing:0.5px; }
.cal-header div:first-child { color:var(--danger); }
.cal-header div:last-child { color:#6b8fc7; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-cell {
  padding:12px 4px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
  text-align:center; cursor:pointer; transition:all 0.2s ease; background:var(--surface);
}
.cal-cell:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--border-hover); }
.cal-cell.today { border-color:var(--primary); background:var(--gold-light); }
.cal-cell.selected { border-color:var(--primary-deep); box-shadow:0 0 0 3px var(--primary-glow); }
.cal-cell.full { background:var(--success-bg); border-color:rgba(90,158,111,0.3); }
.cal-cell.half { background:var(--warning-bg); border-color:rgba(212,168,85,0.35); }
.cal-day { font-size:15px; font-weight:700; color:var(--text); font-family:'Inter',sans-serif; }
.cal-stat { font-size:11px; margin-top:3px; font-weight:500; color:var(--text-muted); }
.cal-stat span { color:var(--primary-deep); font-weight:700; }
.cal-legend { display:flex; gap:24px; justify-content:center; margin-top:18px; font-size:11px; color:var(--text-muted); font-weight:500; }
.legend-box { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }

/* ===== RECORD VIEW ===== */
.day-nav { display:flex; align-items:center; gap:12px; }
.day-nav button {
  background:var(--surface); border:1px solid var(--border);
  padding:8px 16px; border-radius:var(--radius-sm); font-size:15px; cursor:pointer; transition:all 0.2s;
  color:var(--text-secondary);
}
.day-nav button:hover { background:var(--surface-warm); border-color:var(--border-hover); transform:scale(1.04); }
.day-nav h2 { flex:1; text-align:center; font-size:18px; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
.day-jump { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:20px; }
.day-jump button {
  width:34px; height:34px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:12px;
  font-weight:600; cursor:pointer; background:var(--surface); color:var(--text-secondary);
  transition:all 0.15s; font-family:'Inter','Noto Sans KR',sans-serif;
}
.day-jump button:hover { background:var(--surface-warm); border-color:var(--border-hover); transform:translateY(-1px); }
.day-jump button.dj-sel { background:var(--text); color:#fff; border-color:transparent; box-shadow:var(--shadow-md); }
.day-jump button.dj-full { background:var(--success-bg); color:var(--success); border-color:rgba(90,158,111,0.25); }
.day-jump button.dj-part { background:var(--warning-bg); color:var(--accent-deep); border-color:rgba(212,168,85,0.3); }

/* ===== MEMBER RECORD CARD ===== */
.rec-card {
  background:var(--surface); border-radius:var(--radius); padding:22px; margin-bottom:14px;
  box-shadow:var(--shadow-sm); border:1px solid var(--border); transition:all 0.3s;
}
.rec-card:hover { box-shadow:var(--shadow-md); }
.rec-card.rc-done { border-color:rgba(90,158,111,0.25); background:linear-gradient(135deg, #fff 70%, var(--success-bg)); }
.rec-card.rc-partial { border-color:rgba(212,168,85,0.25); background:linear-gradient(135deg, #fff 70%, var(--warning-bg)); }
.rec-header { display:flex; align-items:center; margin-bottom:18px; }
.rec-badge {
  width:38px; height:38px; border-radius:var(--radius-sm); display:flex; align-items:center;
  justify-content:center; color:#fff; font-size:14px; font-weight:700; margin-right:14px;
}
.rb-done { background:var(--success); box-shadow:0 2px 8px rgba(90,158,111,0.25); }
.rb-partial { background:var(--warning); box-shadow:0 2px 8px rgba(212,168,85,0.25); }
.rb-none { background:#c8c0b8; }
.rec-name { flex:1; font-weight:700; font-size:15px; color:var(--text); letter-spacing:-0.3px; }
.rec-status { font-size:11px; padding:5px 14px; border-radius:20px; font-weight:600; letter-spacing:-0.2px; }
.rs-done { background:var(--success-bg); color:var(--success); }
.rs-not { background:rgba(0,0,0,0.03); color:var(--text-muted); }

/* ===== IMAGE DROP ZONE ===== */
.img-zone {
  border:2px dashed rgba(194,154,108,0.3); border-radius:var(--radius-sm); padding:16px;
  text-align:center; cursor:pointer; transition:all 0.3s; position:relative;
  background:var(--surface-warm); min-height:90px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.img-zone:hover { border-color:var(--primary); background:var(--gold-light); }
.img-zone.dragover { border-color:var(--primary-deep); background:var(--primary-light); border-style:solid; }
.img-zone.has-img { border-style:solid; border-color:var(--primary-light); padding:6px; background:var(--surface); }
.img-zone-label { font-size:11px; color:var(--text-muted); font-weight:500; pointer-events:none; line-height:1.6; }
.img-zone-label strong { color:var(--primary-deep); }
.img-zone-icon { font-size:26px; margin-bottom:6px; opacity:0.3; pointer-events:none; }

/* ===== LOCKED STATE ===== */
.locked-banner {
  background:linear-gradient(135deg,#2c2418,#3d2e1f); color:#fff; border-radius:var(--radius);
  padding:18px 24px; margin-bottom:16px; display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow-md);
}
.locked-banner .lock-icon { font-size:28px; }
.locked-banner .lock-text { font-size:14px; font-weight:600; }
.locked-banner .lock-sub { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; font-weight:400; }
.img-zone.locked {
  border-color:rgba(0,0,0,0.08) !important; background:#f0ede9 !important;
  cursor:not-allowed !important; opacity:0.5; pointer-events:none;
}
.main-input.locked {
  background:#f0ede9 !important; cursor:not-allowed !important; opacity:0.5; pointer-events:none;
}
.img-preview { max-width:100%; max-height:200px; border-radius:8px; object-fit:contain; cursor:pointer; transition:opacity 0.2s; }
.img-preview:hover { opacity:0.85; }
.img-remove {
  position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
  background:var(--danger); color:#fff; border:none; cursor:pointer;
  font-size:13px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.2s;
}
.img-zone:hover .img-remove { opacity:1; }
.img-num {
  position:absolute; top:6px; left:6px; background:var(--text);
  color:#fff; font-size:9px; font-weight:700; padding:3px 8px; border-radius:6px;
  letter-spacing:0.3px;
}
.post-section { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }

/* ===== MAIN LINK ROW ===== */
.main-row {
  display:flex; align-items:center; gap:12px; padding:12px 16px;
  background:var(--gold-light); border-radius:var(--radius-sm);
  border:1px solid rgba(201,168,76,0.2);
}
.main-label { font-size:12px; font-weight:700; color:var(--accent-deep); white-space:nowrap; }
.main-input {
  flex:1; border:1.5px solid rgba(201,168,76,0.2); border-radius:8px; padding:8px 14px;
  font-size:13px; font-family:inherit; background:#fff; transition:all 0.2s;
}
.main-input:focus { outline:none; box-shadow:0 0 0 3px rgba(201,168,76,0.15); border-color:var(--gold); }
.main-link { text-decoration:none; font-size:17px; transition:transform 0.2s; display:inline-block; }
.main-link:hover { transform:scale(1.15); }

/* ===== MEMBERS VIEW ===== */
.add-row { display:flex; gap:10px; margin-bottom:20px; }
.add-input {
  flex:1; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:10px 16px;
  font-size:14px; font-family:inherit; transition:all 0.2s; background:var(--surface);
}
.add-input:focus { outline:none; box-shadow:0 0 0 3px var(--primary-glow); border-color:var(--primary); }
.btn-add {
  background:var(--text); color:#fff; border:none;
  padding:10px 22px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer;
  font-family:inherit; font-weight:600; white-space:nowrap; transition:all 0.2s;
}
.btn-add:hover { background:#1a1510; transform:translateY(-1px); box-shadow:var(--shadow-md); }
.member-item {
  display:flex; align-items:center; padding:14px 16px; background:var(--surface);
  border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:8px; transition:all 0.2s;
}
.member-item:hover { border-color:var(--border-hover); box-shadow:var(--shadow-sm); }
.member-num {
  width:28px; height:28px; border-radius:8px;
  background:var(--gold-light); color:var(--primary-deep);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; margin-right:12px; font-family:'Inter',sans-serif;
}
.member-name { flex:1; font-weight:600; color:var(--text); }
.btn-del {
  background:none; border:1px solid rgba(199,93,93,0.2); color:var(--danger); cursor:pointer;
  font-size:12px; padding:6px 14px; border-radius:8px; font-family:inherit; font-weight:500; transition:all 0.2s;
}
.btn-del:hover { background:rgba(199,93,93,0.06); border-color:rgba(199,93,93,0.35); }

/* ===== DATA BUTTONS ===== */
.data-btns { display:flex; gap:10px; flex-wrap:wrap; }
.data-btns button {
  border:none; color:#fff; padding:10px 20px; border-radius:var(--radius-sm); font-size:13px;
  cursor:pointer; font-family:inherit; font-weight:600; transition:all 0.2s;
}
.data-btns button:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
.btn-backup { background:var(--text); }
.btn-restore { background:#78716c; }
.btn-reset { background:var(--danger); }

/* ===== LIGHTBOX ===== */
.lightbox {
  display:none; position:fixed; inset:0; z-index:100;
  background:rgba(44,36,24,0.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  align-items:center; justify-content:center; cursor:pointer;
}
.lightbox.open { display:flex; animation:fadeIn 0.25s ease; }
.lightbox img { max-width:92vw; max-height:90vh; border-radius:var(--radius); box-shadow:0 8px 48px rgba(0,0,0,0.4); }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ===== STORAGE ===== */
.storage-bar { height:3px; background:rgba(194,154,108,0.1); border-radius:2px; margin-top:14px; overflow:hidden; }
.storage-fill { height:100%; background:linear-gradient(90deg, var(--primary), var(--gold)); border-radius:2px; transition:width 0.3s; }
.storage-text { font-size:11px; color:var(--text-muted); margin-top:6px; font-family:'Inter',sans-serif; }

/* ===== RESPONSIVE ===== */
@media (max-width:700px) {
  .summary-grid { grid-template-columns:repeat(2,1fr); }
  .today-grid { grid-template-columns:1fr; }
  .post-section { grid-template-columns:1fr !important; }
  .tab-btn { padding:12px 14px; font-size:11px; }
  .header h1 { font-size:19px; }
  .header p { margin-left:0; margin-top:6px; }
  .header-top { flex-wrap:wrap; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-icon">&#x1f9f5;</div>
      <h1>4월 스레드 챌린지</h1>
    </div>
    <p>매일 인증글 3개 + 대표글 링크 1개</p>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="dashboard">대시보드</button>
  <button class="tab-btn" data-tab="calendar">캘린더</button>
  <button class="tab-btn" data-tab="record">인증기록</button>
  <button class="tab-btn" data-tab="members">멤버관리</button>
  <div class="tab-right">
    <button class="btn-csv" onclick="exportHTML()" style="background:#5a4232">&#x1f4cb; 보고서</button>
    <button class="btn-csv" onclick="exportCSV()">CSV</button>
  </div>
</div>

<div class="container">
  <div class="panel active" id="panel-dashboard"></div>
  <div class="panel" id="panel-calendar"></div>
  <div class="panel" id="panel-record"></div>
  <div class="panel" id="panel-members"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Preview" />
</div>

<script>
var YEAR=2026,MONTH=4,DAYS=30;
var STORAGE_KEY='threads-challenge-2026-04';
var IMG_KEY='threads-challenge-imgs-2026-04';
var DEFAULT_MEMBERS=['강국어','김성훈','김은전','최덕분','추세은','이광희','BELLA EDIT','silver rain','김혜경'];
var MEMBER_THREADS={
  '강국어':'https://www.threads.net/@kang_moonhak',
  '김성훈':'https://www.threads.net/@for_p_lab',
  '김은전':'https://www.threads.net/@ej_kim_78',
  '최덕분':'https://www.threads.net/@gody_coach',
  '추세은':'https://www.threads.net/@infpadhdboss38',
  '이광희':'https://www.threads.net/@future_mind.lounge',
  'BELLA EDIT':'https://www.threads.net/@bellaedit_kr',
  'silver rain':'https://www.threads.net/@designer_eunbee',
  '김혜경':'https://www.threads.net/@becoming_hyekyung'
};
var MAX_IMG_W=400,IMG_QUALITY=0.55;

var data=loadData(),imgData=loadImgData(),selectedDay=getTodayDay(),currentTab='dashboard';

// 기본 멤버 동기화: 코드에 없는 멤버 제거 + 새 멤버 추가
(function syncMembers(){
  var changed=false;
  // 삭제된 멤버 제거
  var old=data.members.slice();
  data.members=data.members.filter(function(m){return DEFAULT_MEMBERS.indexOf(m)!==-1});
  if(data.members.length!==old.length)changed=true;
  // 새 멤버 추가
  for(var i=0;i<DEFAULT_MEMBERS.length;i++){
    if(data.members.indexOf(DEFAULT_MEMBERS[i])===-1){data.members.push(DEFAULT_MEMBERS[i]);changed=true}
  }
  if(changed)save();
})();

function loadData(){try{var d=localStorage.getItem(STORAGE_KEY);if(d)return JSON.parse(d)}catch(e){}return{members:DEFAULT_MEMBERS.slice(),records:{}}}
function loadImgData(){try{var d=localStorage.getItem(IMG_KEY);if(d)return JSON.parse(d)}catch(e){}return{}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function saveImgs(){try{localStorage.setItem(IMG_KEY,JSON.stringify(imgData))}catch(e){alert('저장 공간이 부족합니다.')}}
function recKey(m,d){return m+'_'+YEAR+'-'+pad(MONTH)+'-'+pad(d)}
function imgKey(m,d,p){return recKey(m,d)+'_p'+p}
function pad(n){return n<10?'0'+n:''+n}
function getRec(m,d){return data.records[recKey(m,d)]||{posts:['','',''],mainLink:''}}
function setRec(m,d,rec){data.records[recKey(m,d)]=rec;save()}
function countPosts(rec){var c=0;for(var i=0;i<3;i++)if(rec.posts[i].trim())c++;return c}
function hasPost(rec,m,d,i){return rec.posts[i].trim()!==''||!!imgData[imgKey(m,d,i)]}
function countAll(rec,m,d){var c=0;for(var i=0;i<3;i++)if(hasPost(rec,m,d,i))c++;return c}
function isComplete(rec,m,d){return countAll(rec,m,d)>=3&&rec.mainLink.trim()!==''}
function getTodayDay(){var n=new Date();if(n.getFullYear()===YEAR&&n.getMonth()+1===MONTH)return n.getDate();return 1}
function getStorageUsage(){var t=0;for(var k in localStorage)if(localStorage.hasOwnProperty(k))t+=localStorage[k].length*2;return t}

// 한국시간(KST=UTC+9) 기준 잠금 체크
function getKSTHour(){
  var now=new Date();
  var utc=now.getTime()+now.getTimezoneOffset()*60000;
  var kst=new Date(utc+9*3600000);
  return kst.getHours();
}
function getKSTDay(){
  var now=new Date();
  var utc=now.getTime()+now.getTimezoneOffset()*60000;
  var kst=new Date(utc+9*3600000);
  if(kst.getFullYear()===YEAR&&kst.getMonth()+1===MONTH)return kst.getDate();
  return -1;
}
function isTodayLocked(){
  return getKSTHour()>=22 && selectedDay===getKSTDay();
}

function compressImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,MAX_IMG_W/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',IMG_QUALITY))};img.src=e.target.result};
  reader.readAsDataURL(file);
}

document.getElementById('tabs').addEventListener('click',function(e){var btn=e.target.closest('.tab-btn');if(!btn||!btn.dataset.tab)return;switchTab(btn.dataset.tab)});
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  var t=document.querySelector('[data-tab="'+tab+'"]');if(t)t.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  document.getElementById('panel-'+tab).classList.add('active');render();
}
function render(){
  if(currentTab==='dashboard')renderDashboard();
  else if(currentTab==='calendar')renderCalendar();
  else if(currentTab==='record')renderRecord();
  else if(currentTab==='members')renderMembers();
}

function renderDashboard(){
  var today=getTodayDay(),stats=getStats(),totalDone=0;
  for(var i=0;i<stats.length;i++)totalDone+=stats[i].completed;
  var totalPossible=stats.length*today,overallPct=totalPossible>0?Math.round(totalDone/totalPossible*100):0;
  var todayStatus=[];
  for(var i=0;i<data.members.length;i++){
    var m=data.members[i],rec=getRec(m,today),posts=countAll(rec,m,today),hasMain=rec.mainLink.trim()!=='';
    todayStatus.push({name:m,complete:isComplete(rec,m,today),posts:posts,hasMain:hasMain});
  }
  var todayDone=todayStatus.filter(function(s){return s.complete}).length;
  var h='<div class="summary-grid">';
  h+=sCard('전체 달성률',overallPct+'%','sc-1');
  h+=sCard('오늘 완료',todayDone+'/'+data.members.length,'sc-2');
  h+=sCard('챌린지 일차',today+'일째','sc-3');
  h+=sCard('총 멤버',data.members.length+'명','sc-4');
  h+='</div>';
  h+='<div class="card"><div class="card-title"><span class="icon">&#x1f4cc;</span>오늘의 현황 &middot; '+MONTH+'월 '+today+'일</div><div class="today-grid">';
  var nowHour=new Date().getHours();
  var isSirenTime=(nowHour>=22&&nowHour<=23);
  for(var i=0;i<todayStatus.length;i++){
    var s=todayStatus[i],dc=s.complete?'dot-green':s.posts>0?'dot-yellow':'dot-red';
    var showSiren=isSirenTime&&!s.complete;
    h+='<div class="today-item'+(s.complete?' complete':'')+(showSiren?' siren-item':'')+'">';
    if(showSiren)h+='<span class="siren">&#x1f6a8;</span>';
    else h+='<div class="dot '+dc+'"></div>';
    h+='<span class="today-name">'+esc(s.name)+(MEMBER_THREADS[s.name]?' <a href="'+MEMBER_THREADS[s.name]+'" target="_blank" rel="noopener" style="font-size:11px;color:var(--primary);text-decoration:none;font-weight:500">@</a>':'')+'</span><span class="today-info">'+s.posts+'/3</span>';
    if(showSiren)h+='<span class="siren-tag">미인증!</span>';
    else h+='<span class="badge '+(s.hasMain?'badge-on':'badge-off')+'">'+(s.hasMain?'대표글 ✓':'대표글 ✗')+'</span>';
    h+='</div>';
  }
  h+='</div></div>';
  stats.sort(function(a,b){return b.rate-a.rate});
  h+='<div class="card"><div class="card-title"><span class="icon">&#x1f3c6;</span>멤버별 달성률</div>';
  for(var i=0;i<stats.length;i++){
    var s=stats[i],mc=i<1?'rm-1':i<2?'rm-2':i<3?'rm-3':'rm-n';
    h+='<div class="rank-row"><div class="rank-medal '+mc+'">'+(i+1)+'</div>';
    h+='<span class="rank-name">'+(MEMBER_THREADS[s.name]?'<a href="'+MEMBER_THREADS[s.name]+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" title="Threads 프로필">'+esc(s.name)+'</a>':esc(s.name))+'</span>';
    h+='<div class="rank-bar-bg"><div class="rank-bar" style="width:'+s.rate+'%"></div><span class="rank-pct">'+s.rate+'%</span></div>';
    h+='<span class="rank-days">'+s.completed+'/'+DAYS+'</span></div>';
  }
  h+='</div>';
  document.getElementById('panel-dashboard').innerHTML=h;
}
function sCard(label,value,cls){return '<div class="summary-card '+cls+'"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="bar"></div></div>'}
function getStats(){
  var s=[];for(var i=0;i<data.members.length;i++){var m=data.members[i],c=0;for(var d=1;d<=DAYS;d++)if(isComplete(getRec(m,d),m,d))c++;s.push({name:m,completed:c,rate:Math.round(c/DAYS*100)})}return s;
}

function renderCalendar(){
  var today=getTodayDay(),firstDow=new Date(YEAR,MONTH-1,1).getDay();
  var h='<div class="card"><div class="card-title"><span class="icon">&#x1f4c5;</span>'+YEAR+'년 '+MONTH+'월</div>';
  h+='<div class="cal-header">';['일','월','화','수','목','금','토'].forEach(function(n){h+='<div>'+n+'</div>'});
  h+='</div><div class="cal-grid">';
  for(var i=0;i<firstDow;i++)h+='<div></div>';
  for(var d=1;d<=DAYS;d++){
    var comp=0,partial=0;
    for(var j=0;j<data.members.length;j++){var m=data.members[j],rec=getRec(m,d);if(isComplete(rec,m,d))comp++;else if(countAll(rec,m,d)>0||rec.mainLink.trim())partial++}
    var cls='cal-cell';if(d===today)cls+=' today';if(d===selectedDay)cls+=' selected';
    if(data.members.length>0&&comp===data.members.length)cls+=' full';else if(comp>0||partial>0)cls+=' half';
    h+='<div class="'+cls+'" onclick="selectDayFromCal('+d+')"><div class="cal-day">'+d+'</div><div class="cal-stat"><span>'+comp+'</span>/'+data.members.length+'</div></div>';
  }
  h+='</div><div class="cal-legend">';
  h+='<span><span class="legend-box" style="background:var(--success-bg);border:1px solid rgba(90,158,111,0.3)"></span>전원 완료</span>';
  h+='<span><span class="legend-box" style="background:var(--warning-bg);border:1px solid rgba(212,168,85,0.35)"></span>일부 완료</span>';
  h+='<span><span class="legend-box" style="background:var(--surface);border:1px solid var(--border)"></span>미완료</span>';
  h+='</div></div>';
  document.getElementById('panel-calendar').innerHTML=h;
}
function selectDayFromCal(d){selectedDay=d;switchTab('record')}

function renderRecord(){
  var h='<div class="card"><div class="day-nav"><button onclick="changeDay(-1)">&#x25c0;</button>';
  h+='<h2>'+MONTH+'월 '+selectedDay+'일</h2><button onclick="changeDay(1)">&#x25b6;</button></div></div>';
  h+='<div class="day-jump">';
  for(var d=1;d<=DAYS;d++){
    var allDone=true,anyRec=false;
    for(var j=0;j<data.members.length;j++){var m=data.members[j],rec=getRec(m,d);if(!isComplete(rec,m,d))allDone=false;if(countAll(rec,m,d)>0||rec.mainLink.trim())anyRec=true}
    var cls=d===selectedDay?' dj-sel':allDone&&data.members.length>0?' dj-full':anyRec?' dj-part':'';
    h+='<button class="'+cls+'" onclick="jumpDay('+d+')">'+d+'</button>';
  }
  h+='</div>';
  var locked=isTodayLocked();
  if(locked){
    h+='<div class="locked-banner"><span class="lock-icon">&#x1f512;</span><div><div class="lock-text">오늘의 인증이 마감되었습니다</div><div class="lock-sub">밤 10시 이후에는 당일 인증을 수정할 수 없습니다 (한국시간 기준)</div></div></div>';
  }
  for(var i=0;i<data.members.length;i++){
    var m=data.members[i],rec=getRec(m,selectedDay),posts=countAll(rec,m,selectedDay),done=isComplete(rec,m,selectedDay);
    var cardCls=done?'rc-done':posts>0?'rc-partial':'';
    var badgeCls=done?'rb-done':posts>0?'rb-partial':'rb-none';
    h+='<div class="rec-card '+cardCls+'"><div class="rec-header">';
    h+='<div class="rec-badge '+badgeCls+'">'+(done?'✓':posts)+'</div>';
    h+='<span class="rec-name">'+esc(m)+(MEMBER_THREADS[m]?' <a href="'+MEMBER_THREADS[m]+'" target="_blank" rel="noopener" style="font-size:11px;color:var(--primary);text-decoration:none;font-weight:500">@</a>':'')+'</span>';
    h+='<span class="rec-status '+(done?'rs-done':'rs-not')+'">'+(done?'완료':'인증 '+posts+'/3')+'</span></div>';
    h+='<div class="post-section">';
    for(var p=0;p<3;p++){
      var ik=imgKey(m,selectedDay,p),hasImg=!!imgData[ik];
      h+='<div class="img-zone'+(hasImg?' has-img':'')+(locked?' locked':'')+'" data-member="'+escAttr(m)+'" data-day="'+selectedDay+'" data-post="'+p+'">';
      h+='<span class="img-num">인증 '+(p+1)+'</span>';
      if(hasImg){h+='<img class="img-preview" src="'+imgData[ik]+'" onclick="openLightbox(\''+escAttr(ik)+'\')" />';}
      else if(locked){h+='<div class="img-zone-icon">&#x1f512;</div><div class="img-zone-label">마감</div>'}
      else{h+='<div class="img-zone-icon">&#x1f4f7;</div><div class="img-zone-label"><strong>클릭</strong> · <strong>붙여넣기</strong> · <strong>드래그</strong></div>'}
      h+='</div>';
    }
    h+='</div><div class="main-row"><span class="main-label">&#x1f517; 대표글</span>';
    if(locked){
      h+='<input class="main-input locked" type="text" value="'+escAttr(rec.mainLink||'(마감됨)')+'" disabled />';
    } else {
      h+='<input class="main-input" type="text" placeholder="대표글 링크를 입력하세요" value="'+escAttr(rec.mainLink)+'" data-member="'+escAttr(m)+'" data-day="'+selectedDay+'" onchange="onMainChange(this)" />';
    }
    if(rec.mainLink.trim())h+='<a class="main-link" href="'+escAttr(rec.mainLink)+'" target="_blank" rel="noopener">&#x2197;&#xfe0f;</a>';
    h+='</div></div>';
  }
  document.getElementById('panel-record').innerHTML=h;
  bindImageZones();
}

function bindImageZones(){
  document.querySelectorAll('.img-zone').forEach(function(zone){
    zone.addEventListener('click',function(e){
      if(e.target.classList.contains('img-preview')||e.target.classList.contains('img-remove'))return;
      var input=document.createElement('input');input.type='file';input.accept='image/*';
      input.onchange=function(ev){var file=ev.target.files[0];if(file)handleImageFile(file,zone)};input.click();
    });
    zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('dragover')});
    zone.addEventListener('dragleave',function(){zone.classList.remove('dragover')});
    zone.addEventListener('drop',function(e){e.preventDefault();zone.classList.remove('dragover');var f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))handleImageFile(f,zone)});
    zone.setAttribute('tabindex','0');
    zone.addEventListener('paste',function(e){var items=e.clipboardData.items;for(var i=0;i<items.length;i++)if(items[i].type.startsWith('image/')){handleImageFile(items[i].getAsFile(),zone);e.preventDefault();return}});
  });
}
function handleImageFile(file,zone){
  var m=zone.dataset.member,d=parseInt(zone.dataset.day),p=parseInt(zone.dataset.post);
  compressImage(file,function(dataUrl){imgData[imgKey(m,d,p)]=dataUrl;saveImgs();var rec=getRec(m,d);if(!rec.posts[p].trim()){rec.posts[p]='[이미지]';setRec(m,d,rec)}render()});
}
function removeImg(ik){
  delete imgData[ik];saveImgs();
  var parts=ik.split('_p'),baseKey=parts[0],pIdx=parseInt(parts[1]);
  for(var i=0;i<data.members.length;i++)for(var d=1;d<=DAYS;d++)if(recKey(data.members[i],d)===baseKey){var rec=getRec(data.members[i],d);if(rec.posts[pIdx]==='[이미지]'){rec.posts[pIdx]='';setRec(data.members[i],d,rec)}}
  render();
}
document.addEventListener('paste',function(e){
  if(currentTab!=='record'||e.target.tagName==='INPUT'||isTodayLocked())return;
  var items=e.clipboardData.items;for(var i=0;i<items.length;i++)if(items[i].type.startsWith('image/')){var zones=document.querySelectorAll('.img-zone:not(.has-img)');if(zones.length>0)handleImageFile(items[i].getAsFile(),zones[0]);e.preventDefault();return}
});
function changeDay(delta){selectedDay=Math.max(1,Math.min(DAYS,selectedDay+delta));render()}
function jumpDay(d){selectedDay=d;render()}
function onMainChange(el){var m=el.dataset.member,d=parseInt(el.dataset.day),rec=getRec(m,d);rec.mainLink=el.value;setRec(m,d,rec)}
function openLightbox(ik){var img=imgData[ik];if(!img)return;document.getElementById('lightbox-img').src=img;document.getElementById('lightbox').classList.add('open')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});

function renderMembers(){
  var h='<div class="card"><div class="card-title"><span class="icon">&#x1f465;</span>멤버 관리</div>';
  h+='<div class="add-row"><input class="add-input" type="text" id="newMemberInput" placeholder="새 멤버 이름" onkeydown="if(event.key===\'Enter\')addMember()" />';
  h+='<button class="btn-add" onclick="addMember()">+ 추가</button></div>';
  for(var i=0;i<data.members.length;i++){var mn=data.members[i],tl=MEMBER_THREADS[mn];h+='<div class="member-item"><div class="member-num">'+(i+1)+'</div><span class="member-name">'+esc(mn)+(tl?' <a href="'+tl+'" target="_blank" rel="noopener" style="font-size:11px;color:var(--primary);text-decoration:none;font-weight:500">&#x1f9f5; Threads</a>':'')+'</span><button class="btn-del" onclick="removeMember(\''+escAttr(mn)+'\')">삭제</button></div>'}
  h+='<p style="font-size:12px;color:var(--text-muted);margin-top:14px;font-weight:500">'+data.members.length+'명 참여 중</p></div>';
  var used=getStorageUsage(),maxB=5*1024*1024,pct=Math.min(100,Math.round(used/maxB*100));
  h+='<div class="card"><div class="card-title"><span class="icon">&#x2699;&#xfe0f;</span>데이터 관리</div>';
  h+='<div class="data-btns"><button class="btn-backup" onclick="downloadBackup()">백업</button>';
  h+='<button class="btn-restore" onclick="restoreBackup()">복원</button>';
  h+='<button class="btn-reset" onclick="resetData()">초기화</button></div>';
  h+='<div class="storage-bar"><div class="storage-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="storage-text">'+(used/1024/1024).toFixed(2)+' MB / 5 MB ('+pct+'%)</div></div>';
  document.getElementById('panel-members').innerHTML=h;
}
function addMember(){var input=document.getElementById('newMemberInput'),name=input.value.trim();if(!name)return;if(data.members.indexOf(name)!==-1){alert('이미 존재하는 멤버입니다.');return}data.members.push(name);save();render()}
function removeMember(name){if(!confirm(name+'님을 삭제하시겠습니까?'))return;data.members=data.members.filter(function(m){return m!==name});Object.keys(data.records).forEach(function(k){if(k.indexOf(name+'_')===0)delete data.records[k]});Object.keys(imgData).forEach(function(k){if(k.indexOf(name+'_')===0)delete imgData[k]});save();saveImgs();render()}

function exportHTML(){
  var html='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">';
  html+='<title>스레드 챌린지 보고서 - '+YEAR+'년 '+MONTH+'월</title>';
  html+='<style>';
  html+='@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap");';
  html+='*{margin:0;padding:0;box-sizing:border-box}';
  html+='body{font-family:"Noto Sans KR","Inter",sans-serif;background:#faf8f5;color:#2c2418;padding:32px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}';
  html+='.report-header{text-align:center;margin-bottom:36px;padding-bottom:24px;border-bottom:2px solid #e8d5bf}';
  html+='.report-header h1{font-size:24px;font-weight:800;color:#3d2e1f;letter-spacing:-0.5px}';
  html+='.report-header p{font-size:13px;color:#8c7e6f;margin-top:6px}';
  html+='.stats-bar{display:flex;gap:16px;justify-content:center;margin-bottom:32px;flex-wrap:wrap}';
  html+='.stat-chip{background:#fff;border:1px solid rgba(194,154,108,0.2);border-radius:10px;padding:12px 20px;text-align:center;min-width:120px}';
  html+='.stat-chip .num{font-size:22px;font-weight:800;color:#2c2418;font-family:"Inter",sans-serif}';
  html+='.stat-chip .lbl{font-size:10px;color:#8c7e6f;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}';
  html+='.day-section{margin-bottom:28px;page-break-inside:avoid}';
  html+='.day-title{font-size:15px;font-weight:700;color:#3d2e1f;margin-bottom:12px;padding:8px 14px;background:linear-gradient(90deg,#f5edda,transparent);border-left:3px solid #c9a84c;border-radius:0 8px 8px 0}';
  html+='.member-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1px solid rgba(194,154,108,0.12);border-radius:12px;margin-bottom:8px;background:#fff}';
  html+='.member-row.done{border-color:rgba(90,158,111,0.2);background:linear-gradient(135deg,#fff 80%,#eef6f0)}';
  html+='.m-info{width:140px;flex-shrink:0}';
  html+='.m-name{font-size:13px;font-weight:700;color:#2c2418}';
  html+='.m-thread{font-size:10px;color:#c29a6c;text-decoration:none}';
  html+='.m-status{font-size:10px;margin-top:4px;padding:2px 8px;border-radius:10px;display:inline-block;font-weight:600}';
  html+='.m-status.ok{background:#eef6f0;color:#5a9e6f}';
  html+='.m-status.no{background:rgba(0,0,0,0.04);color:#b5a899}';
  html+='.m-images{display:flex;gap:8px;flex:1;flex-wrap:wrap;align-items:flex-start}';
  html+='.m-images img{width:100px;height:75px;object-fit:cover;border-radius:8px;border:1px solid rgba(194,154,108,0.15)}';
  html+='.m-images .empty-slot{width:100px;height:75px;border-radius:8px;border:1.5px dashed rgba(194,154,108,0.2);display:flex;align-items:center;justify-content:center;font-size:10px;color:#b5a899;background:#fdfbf8}';
  html+='.m-link{flex-shrink:0;width:160px;font-size:11px;word-break:break-all}';
  html+='.m-link a{color:#c29a6c;text-decoration:none}';
  html+='.m-link .no-link{color:#b5a899}';
  html+='.footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid rgba(194,154,108,0.15);font-size:11px;color:#b5a899}';
  html+='@media print{body{padding:16px}@page{margin:12mm}}';
  html+='</style></head><body>';

  // Header
  html+='<div class="report-header"><h1>&#x1f9f5; '+YEAR+'년 '+MONTH+'월 스레드 챌린지 보고서</h1>';
  html+='<p>생성일: '+new Date().toLocaleDateString('ko-KR')+'</p></div>';

  // Stats
  var stats=getStats(),totalDone=0;
  for(var i=0;i<stats.length;i++)totalDone+=stats[i].completed;
  var today=getTodayDay(),totalPossible=stats.length*today;
  var pct=totalPossible>0?Math.round(totalDone/totalPossible*100):0;
  html+='<div class="stats-bar">';
  html+='<div class="stat-chip"><div class="num">'+pct+'%</div><div class="lbl">전체 달성률</div></div>';
  html+='<div class="stat-chip"><div class="num">'+data.members.length+'</div><div class="lbl">참여 멤버</div></div>';
  html+='<div class="stat-chip"><div class="num">'+today+'일째</div><div class="lbl">챌린지 진행</div></div>';
  html+='</div>';

  // Per day
  for(var d=1;d<=today;d++){
    var anyData=false;
    for(var j=0;j<data.members.length;j++){
      var m=data.members[j],rec=getRec(m,d);
      if(countAll(rec,m,d)>0||rec.mainLink.trim()){anyData=true;break}
    }
    html+='<div class="day-section"><div class="day-title">'+MONTH+'월 '+d+'일'+(d===today?' (오늘)':'')+(anyData?'':' — 기록 없음')+'</div>';
    if(anyData){
      for(var j=0;j<data.members.length;j++){
        var m=data.members[j],rec=getRec(m,d),cnt=countAll(rec,m,d),done=isComplete(rec,m,d);
        if(cnt===0&&!rec.mainLink.trim())continue;
        var tl=MEMBER_THREADS[m]||'';
        html+='<div class="member-row'+(done?' done':'')+'">';
        html+='<div class="m-info"><div class="m-name">'+esc(m)+'</div>';
        if(tl)html+='<a class="m-thread" href="'+tl+'" target="_blank">@'+tl.split('@')[1]+'</a>';
        html+='<div><span class="m-status '+(done?'ok':'no')+'">'+(done?'✓ 완료':'인증 '+cnt+'/3')+'</span></div></div>';
        html+='<div class="m-images">';
        for(var p=0;p<3;p++){
          var ik=imgKey(m,d,p),hasImg=!!imgData[ik];
          if(hasImg)html+='<img src="'+imgData[ik]+'" />';
          else if(rec.posts[p].trim())html+='<div class="empty-slot">링크</div>';
          else html+='<div class="empty-slot">—</div>';
        }
        html+='</div>';
        html+='<div class="m-link">';
        if(rec.mainLink.trim())html+='&#x1f517; <a href="'+escAttr(rec.mainLink)+'" target="_blank">'+esc(rec.mainLink.length>30?rec.mainLink.substring(0,30)+'...':rec.mainLink)+'</a>';
        else html+='<span class="no-link">대표글 없음</span>';
        html+='</div></div>';
      }
    }
    html+='</div>';
  }

  html+='<div class="footer">4월 스레드 챌린지 트래커 &middot; 자동 생성 보고서</div>';
  html+='</body></html>';

  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='스레드챌린지_보고서_'+YEAR+'년'+MONTH+'월.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function exportCSV(){
  var csv='\ufeff날짜,멤버,인증글1,인증글2,인증글3,대표글링크,완료여부\n';
  for(var d=1;d<=DAYS;d++)for(var i=0;i<data.members.length;i++){var m=data.members[i],rec=getRec(m,d),dd=YEAR+'-'+pad(MONTH)+'-'+pad(d);
    var p1=imgData[imgKey(m,d,0)]?'[이미지]':rec.posts[0],p2=imgData[imgKey(m,d,1)]?'[이미지]':rec.posts[1],p3=imgData[imgKey(m,d,2)]?'[이미지]':rec.posts[2];
    csv+=csvVal(dd)+','+csvVal(m)+','+csvVal(p1)+','+csvVal(p2)+','+csvVal(p3)+','+csvVal(rec.mainLink)+','+(isComplete(rec,m,d)?'O':'X')+'\n'}
  downloadFile(csv,'스레드챌린지_'+YEAR+'년'+MONTH+'월.csv','text/csv;charset=utf-8;');
}
function csvVal(v){if(v.indexOf(',')!==-1||v.indexOf('"')!==-1||v.indexOf('\n')!==-1)return '"'+v.replace(/"/g,'""')+'"';return v}
function downloadBackup(){downloadFile(JSON.stringify({data:data,images:imgData}),'챌린지백업_'+new Date().toISOString().slice(0,10)+'.json','application/json')}
function restoreBackup(){var input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var imp=JSON.parse(ev.target.result);if(imp.data&&imp.data.members){data=imp.data;imgData=imp.images||{};save();saveImgs();render();alert('복원 완료!')}else if(imp.members){data=imp;save();render();alert('복원 완료!')}else alert('올바른 백업 파일이 아닙니다.')}catch(e){alert('파일 오류')}};reader.readAsText(file)};input.click()}
function resetData(){if(!confirm('모든 데이터를 초기화하시겠습니까?'))return;localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(IMG_KEY);data={members:DEFAULT_MEMBERS.slice(),records:{}};imgData={};save();render();alert('초기화 완료!')}
function downloadFile(c,f,t){var b=new Blob([c],{type:t}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;document.body.appendChild(a);a.click();document.body.removeChild(a)}
function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

render();
</script>
</body>
</html>
